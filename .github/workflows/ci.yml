name: ci

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

# nx-set-shas reads successful Actions runs on the PR target/push branch to select the affected base.
permissions:
  contents: read
  actions: read

# Cancel superseded runs on the same ref (e.g. rapid pushes / force-pushes to a PR) so CI minutes
# are not spent finishing builds that are already out of date.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The docs app build prerenders many pages and needs a larger heap.
  NODE_OPTIONS: --max-old-space-size=6000

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      # Required by wagoid/commitlint-github-action
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          # Required by wagoid/commitlint-github-action
          fetch-depth: 0
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v5
        with:
          failOnWarnings: true
          helpURL: https://github.com/valentinprs/capsule-ng/blob/main/CONTRIBUTING.md#-commit-message-guidelines

  format-and-lint:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full commit history so nx-set-shas can compute the affected base. `blob:none` keeps the
          # whole commit graph (affected still diffs correctly) but downloads file contents lazily -
          # a win for this light job that only touches the affected projects' files.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}
      - name: Deployment policy and URL audit
        run: node --test tools/deployment/*.test.mjs tools/ci/*.test.mjs
      - name: format
        run: pnpm nx format:check --base=$NX_BASE --head=$NX_HEAD
      - name: lint
        run: pnpm nx affected -t lint --parallel=3

  build:
    needs: [commitlint, format-and-lint, types, unit]
    if: github.event_name == 'push' || !github.event.pull_request.draft
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}
      - name: Build
        run: pnpm run build

  unit:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # No longer gated on `build`: vitest runs against source, so unit tests start immediately and
    # run in parallel with the build instead of waiting ~13 min for it.
    steps:
      - uses: actions/checkout@v6
        with:
          # Blobless full-history clone: nx-set-shas needs the graph; vitest only reads the
          # affected projects' files, fetched lazily.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}
      # The brain/helm suites run in a real browser via Vitest browser mode (Playwright/Chromium),
      # so the Chromium binary must be present. Cache it across runs (keyed on the lockfile, which
      # pins the playwright version) to avoid re-downloading ~150 MB each time.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        # On a cache hit the browser is already present; still run install to pull any missing OS
        # libraries (--with-deps), which are not part of the cached browser directory.
        run: pnpm exec playwright install --with-deps chromium
      - name: Test
        run: pnpm nx affected -t test --parallel=3

  e2e:
    needs: [commitlint, format-and-lint, types, unit]
    if: github.event_name == 'push' || !github.event.pull_request.draft
    timeout-minutes: 50
    runs-on: ubuntu-latest
    # Not gated on `build`: each e2e project serves what it tests itself, so the job is independent
    # of the docs-app build and runs in parallel with it.
    # The two e2e projects run as parallel matrix jobs. `needs.e2e.result` stays a single result
    # (failure if either fails), so `ci-complete` and tools/ci/policy.mjs are unchanged.
    # - ui-storybook-e2e: cypress against storybook (devServerTarget ui-storybook:static-storybook).
    # - app-e2e: cypress-axe accessibility audit of docs pages (breadcrumb) against the docs app
    #   Vite dev server (devServerTarget app:serve:e2e, port 4300). Any axe violation fails the job.
    # trpc-app-e2e is not listed: it is not tagged scope:e2e and was never run in CI (it needs a
    # database/health endpoint that is not provisioned here).
    strategy:
      fail-fast: false
      matrix:
        project: [ui-storybook-e2e, app-e2e]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Restore the Cypress binary cache before install so a cypress postinstall is a no-op too.
      - name: Cache Cypress binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: cypress-${{ runner.os }}-
      - uses: ./.github/actions/setup
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}
      - name: Install Cypress
        run: npx cypress install
      - name: End-to-end test
        run: pnpm nx run ${{ matrix.project }}:e2e --outputStyle=stream

  types:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup
      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}
      - name: Typecheck affected TypeScript and Angular templates
        run: node tools/ci/typecheck.mjs

  ci-complete:
    if: always()
    needs: [commitlint, format-and-lint, types, unit, build, e2e]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Verify complete validation on the current ready SHA
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RESULTS: '{"commitlint":"${{ needs.commitlint.result }}","format-and-lint":"${{ needs.format-and-lint.result }}","types":"${{ needs.types.result }}","unit":"${{ needs.unit.result }}","build":"${{ needs.build.result }}","e2e":"${{ needs.e2e.result }}"}'
        run: node tools/ci/complete.mjs
